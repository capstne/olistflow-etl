name: Terraform PR
on:
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.0

    - name: Terraform Version
      run: terraform version
      
    - name: Debug AWS Identity
      run: aws sts get-caller-identity

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::916740064153:role/olistflow-github-role
        aws-region: us-east-1

    - name: Fix OIDC for Terraform Backend
      run: |
        echo "AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token" >> $GITHUB_ENV
        echo $AWS_WEB_IDENTITY_TOKEN_FILE | cat > $(pwd)/web-identity-token  # Pipe token
      env:
        AWS_WEB_IDENTITY_TOKEN_FILE: ${{ env.AWS_WEB_IDENTITY_TOKEN_FILE }}

    - name: Terraform Init
      run: terraform init -input=false
      working-directory: ./infra

    - name: Terraform Format
      run: terraform fmt -check
      working-directory: ./infra

    - name: Terraform Validate
      run: terraform validate
      working-directory: ./infra

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false
      working-directory: ./infra
      
    - uses: actions/github-script@v7
      with:
        script: |
          const output = `#### Terraform Plan 📖\n${steps.plan.outputs.stdout}`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.name,
            body: output
          });
